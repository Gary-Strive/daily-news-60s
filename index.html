<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf2f8">
<title>每天60秒 · 读懂世界</title>
<style>
:root{--ink:#132c46;--muted:#5d7185;--blue:#568bc6;--line:#dce6ee;--paper:#f8fafb;--pale:#e7f0f8}
*{box-sizing:border-box}
html{background:#edf2f5}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eaf2f8 0,#f8fafb 34rem,#f5f8fa 100%);-webkit-font-smoothing:antialiased}
.page{width:min(100%,900px);margin:0 auto;background:var(--paper);box-shadow:0 12px 50px #1a385012;overflow:hidden}
.hero{position:relative;min-height:220px;margin:16px 24px 0;padding:24px 36px;display:flex;justify-content:space-between;align-items:center;gap:18px;isolation:isolate;overflow:hidden;border-radius:24px 24px 0 0;background:linear-gradient(135deg,#f3f9fd 0%,#e5f2fa 48%,#f8fbfd 100%)}
.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 78% 15%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 42%),radial-gradient(ellipse at 10% 100%,rgba(193,220,239,.32) 0%,rgba(193,220,239,0) 48%),linear-gradient(180deg,#f2f8fc 0%,#e9f4fb 70%,#f8fbfd 100%)}
.hero:after{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#c5dfef,#e6f2f9,#c5dfef);pointer-events:none}
.brand,.datebox{position:relative;z-index:1}
.datebox{flex:0 0 140px;text-align:right;min-width:140px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;color:#15324a;backdrop-filter:none;-webkit-backdrop-filter:none}
.brand h1{margin:0;font-family:"Georgia","Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:1px;font-weight:900;color:#0c253c;font-style:italic;background:linear-gradient(120deg,#0e2942 30%,#396f9c 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.clock{font-size:.65em;font-weight:400;white-space:nowrap;-webkit-text-fill-color:#396f9c}
.tagline{font-family:"Songti SC","STSong",serif;font-size:clamp(14px,2.5vw,19px);letter-spacing:2px;margin:8px 0 4px;color:#234761}
.english{font-size:11px;letter-spacing:3px;color:#506d84;text-transform:uppercase}
.date{font-family:Georgia,serif;font-size:17px;font-weight:700;white-space:nowrap;color:#102c45}
.weekday{font-size:14px;margin-top:2px;color:#173b55}
.lunar{border-top:1px solid rgba(35,70,94,.2);margin-top:8px;padding-top:7px;font-size:12px;color:#27465d}
.weather{margin-top:6px;font-size:12px;color:#183b55}
.content{padding:20px 24px 18px}
.status{font-size:12px;color:var(--muted);margin:0 0 8px}
.news-list{display:flex;flex-direction:column}
.news-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:0}
.number{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#e5eef6;color:#315e83;font-family:Georgia,serif;font-size:16px;font-weight:700}
.news-copy{min-width:0}
.news-title{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:18px;line-height:1.5;font-weight:700;margin:0 0 6px;color:#102844}
.news-desc{font-size:14px;line-height:1.85;color:#43586d;margin:0;overflow-wrap:anywhere;white-space:pre-line}
.news-item:nth-child(odd) .number{background:#eaf2f8}
.news-item:nth-child(even) .number{background:#f0eee8;color:#806c50}
.quote{margin:14px 0 0;padding:16px 18px;border-radius:9px;background:linear-gradient(110deg,#e5eff8,#f0f5f8);display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center}
.leaf{font-size:20px;color:var(--blue)}
.quote h2{font-size:18px;color:var(--blue);margin:0 0 4px;font-family:"Songti SC","STSong",serif}
.quote p{font-family:"Songti SC","STSong",serif;font-size:14px;line-height:1.7;margin:0;color:#173653}
.quote small{display:block;color:#7a8d9c;font-size:11px;margin-top:2px}
.footer{display:flex;align-items:center;gap:14px;justify-content:center;color:#9bafc0;letter-spacing:4px;font-size:12px;padding:16px 0 2px}
.footer:before,.footer:after{content:"";height:1px;background:#d7e2eb;flex:1}
.error{padding:24px;text-align:center;color:#6b7f90;font-size:14px}
@media(max-width:620px){
 .hero{min-height:190px;margin:10px 10px 0;padding:18px 16px;gap:8px;border-radius:20px 20px 0 0;align-items:center}
 .datebox{flex:0 0 100px;min-width:100px;padding:0}
 .date{font-size:12px}.weekday{font-size:11px}.lunar{font-size:10px;margin-top:6px;padding-top:5px}.weather{font-size:10px}
 .brand h1{font-size:clamp(22px,6vw,32px);letter-spacing:0;white-space:nowrap}.clock{font-size:.6em}
 .tagline{font-size:12px;letter-spacing:0;margin-top:6px}.english{font-size:8px;letter-spacing:1px}
 .content{padding:14px 15px 16px}
 .news-item{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:14px 0}
 .number{width:28px;height:28px;border-radius:8px;font-size:13px}
 .news-title{font-size:16px}
 .news-desc{font-size:13px;line-height:1.75}
 .quote{padding:13px 12px;grid-template-columns:20px 1fr;gap:8px}
}
@media print{html,body{background:white}.page{box-shadow:none}.hero{print-color-adjust:exact;-webkit-print-color-adjust:exact}.quote{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<main class="page">
<header class="hero">
  <div class="brand">
    <h1>每天60秒 <span class="clock">◷</span></h1>
    <p class="tagline">读懂世界 · 看见更大的世界</p>
    <div class="english">60 SECONDS DAILY</div>
  </div>
  <div class="datebox">
    <div class="date" id="date">加载日期中</div>
    <div class="weekday" id="weekday"></div>
    <div class="lunar" id="lunar"></div>
    <div class="weather">☼　16°C · 晴</div>
  </div>
</header>
<section class="content">
  <p class="status" id="status">正在获取今日新闻…</p>
  <div id="news"></div>
  <section class="quote">
    <div class="leaf">❧</div>
    <div>
      <h2>微语</h2>
      <p id="tip">心怀热爱，奔赴山海。</p>
      <small id="tip-author">—— 每日一语</small>
    </div>
  </section>
  <footer class="footer">每天60秒　读懂世界</footer>
</section>
</main>
<script>
(function(){
"use strict";
var API_LIST=["https://60s-api.viki.moe/v2/60s","https://60s.viki.moe/v2/60s"];
var params=new URLSearchParams(location.search);
var requestedDate=params.get("date");
var weekdays=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function text(v){return typeof v==="string"?v:(v==null?"":String(v))}
function itemTitle(n){return text(n.title||n.content||n.text||n.name||n)}
function itemDesc(n){return text(n.description||n.summary||n.digest||n.desc||"")}
function render(data){
 var d=data.data||data;
 var date=text(d.date)||new Date().toISOString().slice(0,10);
 if(requestedDate && requestedDate!==date){
   document.getElementById("status").textContent="当前接口返回的是最新新闻；暂不支持直接查询 "+requestedDate+" 的历史内容。";
 }else{
   document.getElementById("status").textContent="今日新闻 · 精选速览";
 }
 document.getElementById("date").textContent=date.replace(/-/g,".");
 var parsed=new Date(date+"T12:00:00");
 document.getElementById("weekday").textContent=weekdays[parsed.getDay()]||"";
 document.getElementById("lunar").textContent=text(d.lunar_date||d.lunar||"每日新闻摘要");
 var list=Array.isArray(d.news)?d.news:[];
 var host=document.getElementById("news");
 if(!list.length) throw new Error("接口没有返回新闻列表");
 host.className="news-list";
 host.innerHTML=list.map(function(n,i){
   if(typeof n==="string")n={title:n};
   var title=itemTitle(n),desc=itemDesc(n);
   return '<article class="news-item"><div class="number">'+String(i+1).padStart(2,"0")+'</div><div class="news-copy"><h2 class="news-title">'+esc(title)+'</h2>'+(desc?'<p class="news-desc">'+esc(desc)+'</p>':'')+'</div></article>';
 }).join("");
 var tip=text(d.tip||d.note||d.quote||d.micro_tip||"真正的强大，不是从不跌倒，而是跌倒后依然选择向前。");
 document.getElementById("tip").textContent=tip;
 document.getElementById("tip-author").textContent=text(d.tip_author||d.author||"—— 微语");
}
function load(i){
 if(i>=API_LIST.length){document.getElementById("status").textContent="新闻加载失败，请稍后刷新重试。";document.getElementById("news").innerHTML='<div class="error">暂时无法获取新闻，请检查网络连接后刷新页面。</div>';return}
 fetch(API_LIST[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(render).catch(function(){load(i+1)});
}
load(0);
})();
</script>
</body>
</html>
