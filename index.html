
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6267e9">
<title>每日60S · 今日简报</title>
<style>
:root {
  --purple: #6267e9;
  --ink: #282735;
  --muted: #777783;
  --paper: #fffefa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f1f0f5;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
    "Microsoft YaHei", sans-serif;
  line-height: 1.75;
}
.page {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--paper);
  box-shadow: 0 0 30px #2221;
}
.hero {
  padding: 32px 22px 25px;
  color: white;
  text-align: center;
  background: linear-gradient(135deg, #7279f2, #5555ce);
}
.english {
  font-size: 11px;
  letter-spacing: 4px;
  opacity: .9;
}
.weekday {
  margin: 0;
  font-size: clamp(38px, 10vw, 58px);
  line-height: 1.3;
  font-weight: 850;
  letter-spacing: 3px;
}
.motto {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 1px;
  opacity: .95;
}
.content { padding: 22px 22px 28px; }
.date-line {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 1px;
}
.rule {
  height: 1px;
  margin: 15px 0;
  background: #d9d7d0;
}
.section-label {
  text-align: center;
  color: #8b8a92;
  font-size: 10px;
  letter-spacing: 4px;
}
.headline {
  margin: 0 0 18px;
  color: #ed514a;
  font-size: 30px;
  text-align: center;
  font-weight: 850;
  letter-spacing: 3px;
}
.intro {
  margin-bottom: 18px;
  color: #66636c;
  font-size: 13px;
}
#news { display: grid; gap: 0; }
.item {
  display: grid;
  grid-template-columns: 27px minmax(0, 1fr);
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid #eeece6;
}
.num {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 25px;
  height: 25px;
  margin-top: 2px;
  border-radius: 50%;
  background: #eeeef9;
  color: #6267d8;
  font-size: 12px;
  font-weight: 750;
}
.news-text {
  font-size: 15px;
  font-weight: 550;
  line-height: 1.85;
  overflow-wrap: anywhere;
}
.quote {
  margin-top: 24px;
  padding: 18px 16px;
  border-top: 1px solid #e9dfc6;
  border-bottom: 1px solid #e9dfc6;
  background: #fff9e9;
  color: #9c7540;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
}
.footer {
  padding: 17px 20px 23px;
  color: #9b9890;
  font-size: 10px;
  text-align: center;
}
.status {
  padding: 70px 20px;
  color: #777;
  text-align: center;
}
@media (min-width: 600px) {
  .content { padding: 28px 42px 35px; }
  .hero { padding: 38px 30px 30px; }
  .news-text { font-size: 16px; }
}
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="english">DAILY NEWS · 60 SECONDS</div>
    <h1 class="weekday" id="weekday">今日简报</h1>
    <div class="motto">每天 60 秒，读懂这个世界</div>
  </header>

  <section class="content">
    <div class="date-line" id="date">正在获取今日新闻…</div>
    <div class="rule"></div>
    <div class="section-label">NEWS TODAY</div>
    <h2 class="headline">今日简报</h2>
    <div class="intro">每日热点 · 新闻速览</div>

    <div id="news">
      <div class="status">正在加载新闻，请稍候…</div>
    </div>

    <div class="quote" id="quote" hidden></div>
  </section>

  <footer class="footer">
    每日60S · 读懂世界<br>
    新闻内容由 60s API 提供
  </footer>
</main>

<script>
(function () {
  var APIs = [
    "https://60s-api.viki.moe/v2/60s",
    "https://60s.viki.moe/v2/60s"
  ];

  function text(value) {
    return String(value == null ? "" : value);
  }

  function clean(value) {
    return text(value)
      .replace(/^\s*\d+\s*[.．、:：]\s*/, "")
      .trim();
  }

  function showError(message) {
    document.getElementById("news").innerHTML =
      '<div class="status">' + message +
      '<br>请检查网络后刷新页面。</div>';
  }

  function render(json) {
    var data = json && json.data ? json.data : json;
    var items = Array.isArray(data.news) ? data.news : [];

    if (!items.length) {
      throw new Error("接口没有返回新闻列表");
    }

    var date = text(data.date);
    var weekday = text(data.day_of_week);
    var lunar = text(data.lunar_date);

    document.getElementById("date").textContent =
      [date, lunar].filter(Boolean).join("  ·  ");

    document.getElementById("weekday").textContent =
      weekday || "今日简报";

    var container = document.getElementById("news");
    container.innerHTML = "";

    items.forEach(function (item, index) {
      var title = typeof item === "string"
        ? item
        : (item && (item.title || item.text || item.content));

      title = clean(title);
      if (!title) return;

      var row = document.createElement("article");
      row.className = "item";

      var number = document.createElement("div");
      number.className = "num";
      number.textContent = String(index + 1);

      var body = document.createElement("div");
      body.className = "news-text";
      body.textContent = title;

      row.appendChild(number);
      row.appendChild(body);
      container.appendChild(row);
    });

    var tip = clean(data.tip || "");
    var quote = document.getElementById("quote");

    if (tip) {
      quote.textContent = "「 " + tip + " 」";
      quote.hidden = false;
    } else {
      quote.hidden = true;
    }

    document.title = "每日60S · " + (date || "今日简报");
  }

  function load(index) {
    if (index >= APIs.length) {
      showError("新闻加载失败，可能是接口暂时不可用或浏览器跨域限制。");
      return;
    }

    fetch(APIs[index], { cache: "no-store" })
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(render)
      .catch(function () {
        load(index + 1);
      });
  }

  load(0);
})();
</script>
</body>
</html>
