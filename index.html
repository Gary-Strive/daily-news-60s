<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf2f8">
<title>每日60秒 · 读懂世界</title>
<style>
:root{--ink:#132c46;--muted:#5d7185;--blue:#568bc6;--line:#dce6ee;--paper:#f8fafb;--pale:#e7f0f8}
*{box-sizing:border-box}
html{background:#edf2f5}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eaf2f8 0,#f8fafb 34rem,#f5f8fa 100%);-webkit-font-smoothing:antialiased}
.page{width:min(100%,900px);margin:0 auto;background:var(--paper);box-shadow:0 12px 50px #1a385012;overflow:hidden}
.hero{position:relative;min-height:270px;padding:32px 34px 34px;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;isolation:isolate;overflow:hidden;background:#e9f3fa}
.hero:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(242,249,253,.94) 0%,rgba(234,245,251,.82) 52%,rgba(225,240,248,.76) 100%),url("https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85") center 48%/cover}
.hero:after{content:"";position:absolute;z-index:-1;left:-5%;right:-5%;bottom:-2px;height:72px;background:linear-gradient(175deg,transparent 0 30%,rgba(255,255,255,.18) 31% 33%,#f8fafb 34%);opacity:1}
.brand,.datebox{position:relative;z-index:1}
.datebox{flex:0 0 190px;text-align:right;min-width:190px;padding:14px 16px 15px;border:1px solid rgba(255,255,255,.88);border-radius:14px;background:rgba(250,253,255,.88);box-shadow:0 8px 24px rgba(42,77,103,.10);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#173a56}
.brand h1{margin:0;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(38px,7vw,64px);line-height:1.12;letter-spacing:2px;font-weight:800;color:#102c47;text-shadow:0 1px 0 #ffffff90}
.clock{font-size:.72em;font-weight:400;white-space:nowrap}
.tagline{font-family:"Songti SC","STSong",serif;font-size:clamp(15px,2.8vw,22px);letter-spacing:2px;margin:14px 0 6px}
.english{font-size:11px;letter-spacing:3px}
.date{font-size:19px;font-weight:700;white-space:nowrap;color:#153b59}
.weekday{font-size:16px;margin-top:5px;color:#294f6c}
.lunar{border-top:1px solid rgba(55,99,129,.22);margin-top:12px;padding-top:10px;font-size:12px;color:#45667d}
.weather{margin-top:10px;font-size:13px;color:#294f6c}
.content{padding:24px 28px 22px}
.status{font-size:12px;color:var(--muted);margin:0 0 10px}
.news-list{display:flex;flex-direction:column}
.news-item{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:0}
.number{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#e5eef6;color:#315e83;font-family:Georgia,serif;font-size:17px;font-weight:700}
.news-copy{min-width:0}
.category{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:1px;margin:0 0 6px}
.news-title{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:19px;line-height:1.55;font-weight:700;margin:0 0 7px;color:#102844}
.news-desc{font-size:14px;line-height:1.9;color:#43586d;margin:0;overflow-wrap:anywhere;white-space:pre-line}
.news-item:nth-child(odd) .number{background:#eaf2f8}
.news-item:nth-child(even) .number{background:#f0eee8;color:#806c50}
.quote{margin:18px 0 0;padding:18px 20px;border-radius:9px;background:linear-gradient(110deg,#e5eff8,#f0f5f8);display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center}
.leaf{font-size:22px;color:var(--blue)}
.quote h2{font-size:19px;color:var(--blue);margin:0 0 5px;font-family:"Songti SC","STSong",serif}
.quote p{font-family:"Songti SC","STSong",serif;font-size:15px;line-height:1.75;margin:0;color:#173653}
.quote small{display:block;color:#7a8d9c;font-size:11px;margin-top:3px}
.quote-art{font-family:"KaiTi","STKaiti",serif;font-size:17px;line-height:1.6;text-align:center;white-space:nowrap;color:#436b8a}
.footer{display:flex;align-items:center;gap:14px;justify-content:center;color:#9bafc0;letter-spacing:4px;font-size:12px;padding:20px 0 3px}
.footer:before,.footer:after{content:"";height:1px;background:#d7e2eb;flex:1}
.error{padding:24px;text-align:center;color:#6b7f90;font-size:14px}
@media(max-width:620px){
 .hero{min-height:220px;padding:23px 16px 30px;gap:10px}
 .datebox{flex:0 0 142px;min-width:142px;padding:11px 10px 12px;border-radius:11px}
 .date{font-size:15px}.weekday{font-size:13px}.lunar{font-size:10px}.weather{font-size:11px}
 .brand h1{letter-spacing:0}.tagline{letter-spacing:1px}.english{letter-spacing:1.5px}
 .content{padding:16px 17px 20px}
 .news-item{grid-template-columns:34px minmax(0,1fr);gap:10px;padding:16px 0}
 .number{width:30px;height:30px;border-radius:9px;font-size:14px}
 .news-title{font-size:17px}
 .news-desc{font-size:13px;line-height:1.85}
 .quote{padding:15px 13px;grid-template-columns:22px 1fr;gap:8px}
 .quote-art{display:none}
}
@media print{html,body{background:white}.page{box-shadow:none}.hero{print-color-adjust:exact;-webkit-print-color-adjust:exact}.quote{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<main class="page">
<header class="hero">
  <div class="brand">
    <h1>每日60秒 <span class="clock">◷</span></h1>
    <p class="tagline">读懂世界 · 看见更大的世界</p>
    <div class="english">60 SECONDS DAILY</div>
  </div>
  <div class="datebox">
    <div class="date" id="date">加载日期中</div>
    <div class="weekday" id="weekday"></div>
    <div class="lunar" id="lunar"></div>
    <div class="weather">◉　每日新闻速览</div>
  </div>
</header>
<section class="content">
  <p class="status" id="status">正在获取今日新闻…</p>
  <div id="news"></div>
  <section class="quote">
    <div class="leaf">❧</div>
    <div><h2>微语</h2><p id="tip">心怀热爱，奔赴山海。</p><small id="tip-author">—— 每日一语</small></div>
    <div class="quote-art">保持热爱<br>奔赴山海</div>
  </section>
  <footer class="footer">每日60秒　读懂世界</footer>
</section>
</main>
<script>
(function(){
"use strict";
var API_LIST=["https://60s-api.viki.moe/v2/60s","https://60s.viki.moe/v2/60s"];
var params=new URLSearchParams(location.search);
var requestedDate=params.get("date");
var weekdays=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function text(v){return typeof v==="string"?v:(v==null?"":String(v))}
function itemTitle(n){return text(n.title||n.content||n.text||n.name||n)}
function itemDesc(n){return text(n.description||n.summary||n.digest||n.desc||"")}
function itemCategory(n,i){return text(n.category||n.type||n.tag||["国内新闻","国际新闻","科技前沿","社会民生","文化教育"][i%5])}
function itemImage(n){return text(n.image||n.img||n.cover||n.pic||n.thumbnail||"")}
function render(data){
 var d=data.data||data;
 var date=text(d.date)||new Date().toISOString().slice(0,10);
 if(requestedDate && requestedDate!==date){
   document.getElementById("status").textContent="当前接口返回的是最新新闻；暂不支持直接查询 "+requestedDate+" 的历史内容。";
 }else{
   document.getElementById("status").textContent="今日新闻 · 精选速览";
 }
 document.getElementById("date").textContent=date.replace(/-/g,".");
 var parsed=new Date(date+"T12:00:00");
 document.getElementById("weekday").textContent=weekdays[parsed.getDay()]||"";
 document.getElementById("lunar").textContent=text(d.lunar_date||d.lunar||"每日新闻摘要");
 var list=Array.isArray(d.news)?d.news:[];
 var host=document.getElementById("news");
 if(!list.length) throw new Error("接口没有返回新闻列表");
 host.className="news-list";
 host.innerHTML=list.map(function(n,i){
   if(typeof n==="string")n={title:n};
   var title=itemTitle(n),desc=itemDesc(n),cat=itemCategory(n,i);
   return '<article class="news-item"><div class="number">'+String(i+1).padStart(2,"0")+'</div><div class="news-copy"><p class="category">'+esc(cat)+'</p><h2 class="news-title">'+esc(title)+'</h2>'+(desc?'<p class="news-desc">'+esc(desc)+'</p>':'')+'</div></article>';
 }).join("");
 var tip=text(d.tip||d.note||d.quote||d.micro_tip||"真正的强大，不是从不跌倒，而是跌倒后依然选择向前。");
 document.getElementById("tip").textContent=tip;
 document.getElementById("tip-author").textContent=text(d.tip_author||d.author||"—— 微语");
}
function load(i){
 if(i>=API_LIST.length){document.getElementById("status").textContent="新闻加载失败，请稍后刷新重试。";document.getElementById("news").innerHTML='<div class="error">暂时无法获取新闻，请检查网络连接后刷新页面。</div>';return}
 fetch(API_LIST[i],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(render).catch(function(){load(i+1)});
}
load(0);
})();
</script>
</body>
</html>
